<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/CSS/style.css">
</head>

<body>
    <header>
        <div class="title text-center h1">Product-Managment-System</div>
    </header>

    <main>

        <section class="form-container">
            <h3>Add New Product</h3>

            <div class="input-group">
                <input type="text" id="p-title" placeholder="Product-Title">
                <input type="number" id="p-price" placeholder="Price ($)">
                <input type="text" id="p-image" placeholder="URl : https://www.crossword.in/cdn/shop/products/crosswordonline-toys-games-default-title-mirada-55cm-jumbo-teddy-bear-soft-toy-beige-40250340016345.jpg?v=1746619255">
                <input type="text" id="p-category" placeholder="Category">
                <button id="add-btn" onclick="addProduct()">Add Product</button>
            </div>
        </section>

        <section class="controls">
            <input type="text" id="search-input" placeholder="Search by title......" oninput="handleSearch()">

            <select id="filterCategory" onchange="handleSort()">
                <option value="none">Sort by Price</option>
                <option value="low">Low to High</option>
                <option value="high">High to Low</option>
            </select>
        </section>

        <div id="product-list" class="product-grid"></div>

    </main>

    <script src="./assets/JS/script.js"></script>
</body>

</html>
